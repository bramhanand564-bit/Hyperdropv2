name: NEXUS CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JavaScript syntax check
        run: >-
          node --check src/main.js &&
          node --check src/lobby.js &&
          node --check src/animation/heroRig.js &&
          node --check src/animation/heroAnimator.js &&
          node --check src/animation/hero2d.js &&
          node --check src/animation/hero2dClips.js &&
          node --check src/animation/hero3dMicroLayer.js &&
          node --check src/animation/nexusHeroGLB.js
      - name: Verify animation architecture
        run: node tools/verify-animation-architecture.mjs
      - name: Generate production NEXUS Hero GLB
        run: |
          python3 -m pip install --disable-pip-version-check --quiet trimesh
          python3 tools/generate-nexus-hero-glb.py
      - name: Validate NEXUS Hero GLB contract
        run: node tools/verify-nexus-hero-glb.mjs --strict
