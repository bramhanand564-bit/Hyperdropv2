name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NEXUS APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Prepare game assets
        run: |
          mkdir -p android/app/src/main/assets/src
          cp index.html android/app/src/main/assets/index.html
          cp src/main.js android/app/src/main/assets/src/main.js
          cp src/styles.css android/app/src/main/assets/src/styles.css
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js -o android/app/src/main/assets/src/three.module.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/assets/index.html")
          s=p.read_text()
          s=s.replace('"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"', '"three":"./src/three.module.js"')
          p.write_text(s)
          PY

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew -p android assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-world-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30