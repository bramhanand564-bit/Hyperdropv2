name: Build APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NEXUS APK
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK not found at $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Prepare game assets
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets/src
          cp index.html android/app/src/main/assets/index.html
          cp src/main.js android/app/src/main/assets/src/main.js
          cp src/styles.css android/app/src/main/assets/src/styles.css
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js -o android/app/src/main/assets/src/three.module.js
          python3 - <<'PY'
          from pathlib import Path
          # Android WebView is more reliable with a direct relative ES-module import
          # than an import-map dependency under file:// URLs.
          main = Path("android/app/src/main/assets/src/main.js")
          s = main.read_text()
          old_import = "import * as THREE from 'three';"
          new_import = "import * as THREE from './three.module.js';"
          if old_import not in s:
              raise SystemExit("Three.js source import not found")
          main.write_text(s.replace(old_import, new_import, 1))

          index = Path("android/app/src/main/assets/index.html")
          html = index.read_text()
          old_map = '"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"'
          new_map = '"three":"./src/three.module.js"'
          if old_map in html:
              index.write_text(html.replace(old_map, new_map))
          PY

      - name: Build debug APK
        run: |
          set -euo pipefail
          /tmp/gradle-8.9/bin/gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/NEXUS-World-debug.apk
          ls -lh dist/NEXUS-World-debug.apk

      - name: Package APK ZIP
        run: |
          set -euo pipefail
          cd dist
          zip -9 NEXUS-World-debug-APK.zip NEXUS-World-debug.apk
          ls -lh NEXUS-World-debug-APK.zip

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-world-apk-${{ github.run_number }}
          path: dist/NEXUS-World-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-world-apk-zip-${{ github.run_number }}
          path: dist/NEXUS-World-debug-APK.zip
          if-no-files-found: error
          retention-days: 30
