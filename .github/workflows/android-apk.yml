name: Build NEXUS Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Download Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Prepare offline game assets
        run: |
          mkdir -p android/app/src/main/assets/src
          cp index.html android/app/src/main/assets/index.html
          cp src/main.js android/app/src/main/assets/src/main.js
          cp src/styles.css android/app/src/main/assets/src/styles.css
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js -o android/app/src/main/assets/src/three.module.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/assets/index.html")
          s=p.read_text().replace('"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"','"three":"./src/three.module.js"')
          p.write_text(s)
          PY
      - name: Build APK
        run: /tmp/gradle-8.9/bin/gradle -p android assembleDebug --no-daemon
      - name: Verify and package
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/NEXUS-World-debug.apk
          cd dist
          zip -9 NEXUS-World-debug-APK.zip NEXUS-World-debug.apk
          sha256sum NEXUS-World-debug.apk NEXUS-World-debug-APK.zip
      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-World-APK
          path: |
            dist/NEXUS-World-debug.apk
            dist/NEXUS-World-debug-APK.zip
          if-no-files-found: error
          retention-days: 30
