name: Build NEXUS Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Prepare offline game assets
        run: |
          mkdir -p android/app/src/main/assets/src
          cp index.html android/app/src/main/assets/index.html
          cp src/main.js android/app/src/main/assets/src/main.js
          cp src/styles.css android/app/src/main/assets/src/styles.css
          curl -fsSL https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js -o android/app/src/main/assets/src/three.module.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/assets/index.html")
          s = p.read_text()
          s = s.replace('"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"', '"three":"./src/three.module.js"')
          p.write_text(s)
          PY

      - name: Build debug APK
        run: /tmp/gradle-8.9/bin/gradle -p android assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-World-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
